<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MediQueue</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <style>

        /* ── RESET ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: #f4f8fb;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: 'Nunito', sans-serif; cursor: pointer; border: none; }
        img { display: block; max-width: 100%; }

        /* ── NAVBAR ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #007bff;
            color: white;
            box-shadow: 0 2px 12px rgba(0,123,255,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo img { width: 180px; object-fit: contain; }
        .logo-text {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            display: none;
        }
        .logo-text span { color: #7dd3fc; }

        /* Navbar right side: username + logout */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-username {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.85);
            font-weight: 600;
        }
        .logout-btn {
            background: white;
            color: #007bff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.88rem;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logout-btn:hover {
            background: #ffe0e0;
            color: #e53e3e;
            transform: translateY(-1px);
        }

        /* ── DASHBOARD BODY ── */
        .dashboard { padding: 40px; }

        /* Welcome banner */
        .welcome-banner {
            background: linear-gradient(120deg, #007bff 0%, #0056d6 60%, #00c2d4 100%);
            border-radius: 16px;
            padding: 28px 32px;
            color: white;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0,123,255,0.25);
        }
        .welcome-text h2 {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .welcome-text p {
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .welcome-icon { font-size: 3.5rem; }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 4px 16px rgba(0,123,255,0.08);
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #dce8f5;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,123,255,0.14);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(0,123,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .stat-num {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2332;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #6b84a0;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Section heading */
        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .section-heading h2 {
            font-family: 'Lora', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a2332;
        }
        .section-heading span {
            font-size: 0.85rem;
            color: #6b84a0;
            font-weight: 600;
        }

        /* ── DOCTOR CARDS GRID ── */
        .doctor-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .doctor-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,123,255,0.08);
            border: 1px solid #dce8f5;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeUp 0.4s ease both;
        }
        .doctor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,123,255,0.14);
        }

        /* Doctor avatar circle */
        .doc-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #007bff, #00c2d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .doctor-card h3 {
            font-size: 1rem;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 6px;
        }
        .doctor-card .spec-tag {
            display: inline-block;
            background: rgba(0,123,255,0.08);
            color: #007bff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .doctor-card .available-label {
            font-size: 0.8rem;
            color: #38a169;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 14px;
        }
        .available-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38a169;
            animation: pulse 2s infinite;
        }

        /* Book button */
        .book-btn {
            width: 100%;
            padding: 11px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(0,123,255,0.25);
        }
        .book-btn:hover {
            background: #0056d6;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,123,255,0.32);
        }
        .book-btn:disabled {
            background: #dce8f5;
            color: #6b84a0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── LOADING / EMPTY STATES ── */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b84a0;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dce8f5;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state h3 {
            font-size: 1.1rem;
            color: #1a2332;
            margin-bottom: 8px;
        }
        .empty-state p { font-size: 0.9rem; color: #6b84a0; }

        /* ── BOOKING MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: white;
            border-radius: 18px;
            padding: 36px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 16px 56px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal-overlay.show .modal { transform: translateY(0); }

        .modal h3 {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a2332;
            margin-bottom: 6px;
        }
        .modal .modal-doc {
            font-size: 0.88rem;
            color: #6b84a0;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* Modal fields */
        .modal-field { margin-bottom: 16px; }
        .modal-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #3d5068;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
        }
        .modal-field input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dce8f5;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.93rem;
            color: #1a2332;
            background: #f4f8fb;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .modal-field input:focus {
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .modal-actions { display: flex; gap: 12px; margin-top: 8px; }
        .modal-cancel {
            flex: 1;
            padding: 12px;
            border: 1.5px solid #dce8f5;
            border-radius: 10px;
            background: none;
            font-size: 0.9rem;
            font-weight: 700;
            color: #6b84a0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-cancel:hover { border-color: #6b84a0; color: #1a2332; }
        .modal-confirm {
            flex: 2;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(0,123,255,0.3);
        }
        .modal-confirm:hover { background: #0056d6; }
        .modal-confirm:disabled { opacity: 0.7; cursor: not-allowed; }

        /* ── TOAST NOTIFICATION ── */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            color: white;
            z-index: 2000;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #38a169; }
        .toast.error   { background: #e53e3e; }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.4); opacity: 0.6; }
        }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="header">
        <div class="logo">
            <img
                src="images/MediQueue_logo.png"
                alt="MediQueue"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
            >
            <div class="logo-text">Medi<span>Queue</span></div>
        </div>
        <div class="nav-right">
            <span class="nav-username" id="navUsername"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- DASHBOARD BODY -->
    <section class="dashboard">

        <!-- Welcome banner -->
        <div class="welcome-banner">
            <div class="welcome-text">
                <h2 id="welcomeMsg">Welcome!</h2>
                <p>Find a doctor and book your appointment below.</p>
            </div>
            <div class="welcome-icon">🏥</div>
        </div>

        <!-- Stats row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">👨‍⚕️</div>
                <div>
                    <div class="stat-num" id="statDoctors">—</div>
                    <div class="stat-label">Available Doctors</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div>
                    <div class="stat-num" id="statAppts">0</div>
                    <div class="stat-label">Your Appointments</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div>
                    <div class="stat-num">24/7</div>
                    <div class="stat-label">Online Booking</div>
                </div>
            </div>
        </div>

        <!-- Available Doctors -->
        <div class="section-heading">
            <h2>Available Doctors</h2>
            <span id="doctorCount"></span>
        </div>

        <!-- Doctor list — filled by JS -->
        <div class="doctor-list" id="doctorList">
            <!-- Loading state shown first -->
            <div class="loading-state" style="grid-column: 1/-1">
                <div class="loading-spinner"></div>
                <p>Loading doctors…</p>
            </div>
        </div>

    </section>

    <!-- BOOKING MODAL -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h3>Book Appointment</h3>
            <div class="modal-doc" id="modalDocName"></div>

            <div class="modal-field">
                <label>Appointment Date</label>
                <input type="date" id="bookDate" min="">
            </div>
            <div class="modal-field">
                <label>Appointment Time</label>
                <input type="time" id="bookTime">
            </div>

            <div class="modal-actions">
                <button class="modal-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-confirm" id="confirmBtn" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Link to external JavaScript file -->
    <script src="js/scripts.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) { window.location.href = "login.html"; }
    document.getElementById("welcomeMsg").innerText = "Welcome, " + user.name + " 👋";
    document.getElementById("navUsername").innerText = user.name;
    document.getElementById("bookDate").min = new Date().toISOString().split("T")[0];
    loadDoctors();  // ← this must be here
</script>
</body>
</html>
